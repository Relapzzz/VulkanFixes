plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

// Shared setup for every versions/<minecraft> subproject. Each one sets minecraft_version,
// yarn_mappings, minecraft_range and minecraft_label in its own gradle.properties, and
// builds build/libs/vulkanfixes-<mod_version>+mc<minecraft_label>.jar.
subprojects {
	apply plugin: 'net.fabricmc.fabric-loom-remap'

	version = "${mod_version}+mc${minecraft_label}"
	group = maven_group
	base.archivesName = 'vulkanfixes'

	repositories {
		maven {
			name = 'Modrinth'
			url = 'https://api.modrinth.com/maven'
			content {
				includeGroup 'maven.modrinth'
			}
		}
		mavenCentral()
	}

	// Code and resources that are the same on every Minecraft version.
	sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
	sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

	loom {
		accessWidenerPath = file('src/main/resources/vulkanfixes.accesswidener')
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
		modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	}

	tasks.withType(ProcessResources).configureEach {
		// entrypoints is only set by subprojects that have a Mod Menu config screen.
		def props = [version: project.version, minecraft_range: project.minecraft_range, entrypoints: project.findProperty('entrypoints') ?: '{}']
		inputs.properties props

		filesMatching('fabric.mod.json') {
			expand props
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
	}

	java {
		withSourcesJar()

		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}
}

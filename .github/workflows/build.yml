name: Build

# Every push and pull request builds the jar for every Minecraft version. Pushing a tag like
# v1.2.3 also publishes a GitHub release with all of them, after checking the tag matches
# mod_version in gradle.properties.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Collect jars
        id: jars
        run: |
          mkdir dist
          cp versions/*/build/libs/vulkanfixes-*.jar dist/
          rm dist/*-sources.jar
          ls dist
          echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: vulkanfixes-${{ steps.jars.outputs.version }}
          path: dist/*.jar

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.jars.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=${{ steps.jars.outputs.version }} in gradle.properties"
            exit 1
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VulkanFixes ${{ steps.jars.outputs.version }}
          files: dist/*.jar
          generate_release_notes: true
